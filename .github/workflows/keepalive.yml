name: keepalive

# Pings the free-tier API every 14 minutes so Render does not spin it down (it sleeps after 15 idle minutes)
# and so /health runs its cheap database query (keeps Supabase active).
# NOTE: GitHub disables scheduled workflows after 60 days without repository activity;
# push a commit (or re-enable the workflow in the Actions tab) to restart it.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/14 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then echo "RENDER_URL repository variable is not set; nothing to ping."; exit 0; fi
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors "${RENDER_URL%/}/health"
